<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a5f33">
  <title>Win celebration preview</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Local preview only: it mirrors the app's hand-off, animation then card. */
    #preview-hint {
      position: fixed;
      left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 8px);
      text-align: center; font-size: 13px; color: rgba(255, 255, 255, 0.7);
      pointer-events: none;
      z-index: 30;
    }
    #app { cursor: pointer; }
    #preview-card { z-index: 20; }
  </style>
</head>
<body>
  <div id="app">
    <main id="board" aria-label="Celebration preview"></main>
  </div>
  <canvas id="celebration" hidden></canvas>
  <div id="preview-card" class="modal win" hidden>
    <div class="modal-box">
      <h2 class="modal-title">You won!</h2>
      <p class="modal-message">Preview card — the real game shows moves here.</p>
      <div class="modal-buttons">
        <button type="button" class="primary">New deal</button>
      </div>
    </div>
  </div>
  <p id="preview-hint">tap to start · tap during it to skip</p>
  <script type="module">
    // Local device harness: plays the win celebrations without a game, so the floor,
    // safe-area, composition and the hand-off to the win card can be judged on an actual
    // phone. Committed and in the service-worker shell on purpose: it is how every
    // celebration gets checked on hardware.
    //
    // Each tap after the first plays the next celebration in the rotation. Pin one with
    // /preview.html?v=fan (also shuffle, conga, dancer, vortex, waterfall), and change the
    // cadence with ?ms=120.
    import { startCelebration, stopCelebration, CELEBRATIONS } from './js/celebrate.js';
    import { createDeck } from './js/game.js';

    const board = document.getElementById('board');
    const canvas = document.getElementById('celebration');
    const card = document.getElementById('preview-card');
    const hint = document.getElementById('preview-hint');
    const params = new URLSearchParams(location.search);
    const pinned = CELEBRATIONS.indexOf(params.get('v'));
    const launchMs = Number(params.get('ms')) || undefined;
    const seed = Number(params.get('seed')) || 1;
    let slot = pinned >= 0 ? pinned : 0;

    // Same card sizing rule as the real board, so the preview matches play.
    function layout() {
      const W = board.clientWidth;
      const H = board.clientHeight;
      const phone = W < 500;
      const pad = phone ? 3 : Math.round(W * 0.012);
      const gap = phone ? 3 : Math.round(W * 0.01);
      let cw = Math.floor((W - pad * 2 - gap * 6) / 7);
      cw = Math.max(20, Math.min(cw, Math.floor(H / 5.2 / 1.4), 130));
      const ch = Math.round(cw * 1.4);
      const left = Math.round((W - (cw * 7 + gap * 6)) / 2);
      const tabGap = Math.max(gap * 2, Math.round(ch * 0.16));
      const fdOff = Math.max(4, Math.round(ch * 0.11));
      const fuOff = Math.round(ch * 0.34);
      let drop = 0;
      if (phone && H > W) {
        const needed = pad * 2 + ch + tabGap + 6 * fdOff + 12 * fuOff + ch;
        drop = Math.max(0, Math.min(Math.round(H * 0.25), H - needed));
      }
      const topY = pad + drop;
      board.style.setProperty('--cw', cw + 'px');
      board.style.setProperty('--ch', ch + 'px');
      return { cw, ch, x: left, y: topY };
    }

    const cards = createDeck().map((c) => ({ ...c, faceUp: true }));
    const piles = ['S', 'H', 'D', 'C'].map((suit, i) => ({
      x: 0, y: 0,
      cards: cards.filter((c) => ['S', 'H', 'D', 'C'][i] === c.suit),
    }));

    let celebration = null;

    function placePiles() {
      const { cw, x, y } = layout();
      const gap = cw * 0.1;
      const rect = board.getBoundingClientRect();
      piles.forEach((p, i) => { p.x = Math.round(rect.left + x + i * (cw + gap)); p.y = Math.round(rect.top + y); });
    }

    function run() {
      const { cw, ch } = layout();
      placePiles();
      card.hidden = true;
      const variant = CELEBRATIONS[slot];
      if (pinned < 0) slot = (slot + 1) % CELEBRATIONS.length;
      hint.textContent = `${variant} · tap during it to skip`;
      celebration = startCelebration(canvas, {
        variant,
        cw,
        ch,
        cards,
        piles,
        launchMs,
        seed,
      });
      celebration.finished.then((completed) => {
        celebration = null;
        if (!completed) return;
        card.hidden = false;
        card.style.animation = 'none';
        void card.offsetWidth;
        card.style.animation = ''; // restart the same 300ms fade-in the app uses
        hint.textContent = `${variant} · tap to play the next one`;
      });
    }

    function skip() {
      if (!celebration) return;
      const current = celebration;
      celebration = null; // prevent a second tap from restarting during the fade
      current.stop(); // the same short fade the app plays, then the card follows
    }

    function reset() {
      if (celebration) {
        const current = celebration;
        celebration = null;
        current.stop();
      }
      stopCelebration();
      card.hidden = true;
      hint.textContent = 'tap to start · tap during it to skip';
    }

    document.getElementById('app').addEventListener('pointerdown', () => {
      if (celebration) skip();
      else run();
    });
    card.querySelector('button').addEventListener('click', (e) => {
      e.stopPropagation();
      reset();
    });
    window.addEventListener('pagehide', reset);
  </script>
</body>
</html>
