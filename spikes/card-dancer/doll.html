<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spike — card doll (2D)</title>
<style>
  /* SPIKE — throwaway. */
  html, body { margin: 0; height: 100%; background: #0d3a2c; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: rgba(4, 18, 13, 0.72); color: #eaf3ec;
    font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; gap: 8px; align-items: center;
  }
  #hud input { flex: 1; accent-color: #7fdc9a; }
  button {
    font: inherit; color: inherit; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 3px 10px;
  }
  html.nohud #hud { display: none; }
</style>
</head>
<body>
<canvas id="doll"></canvas>
<div id="hud"><button id="play">pause</button><input id="scrub" type="range" min="0" max="4" step="0.01"><span id="tv">0.00s</span></div>
<script type="module" src="./doll.js"></script>
</body>
</html>
